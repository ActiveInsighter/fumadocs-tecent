services:
  n8n:
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_DOCUMENT_PUBLISH_SECRET: ${N8N_DOCUMENT_PUBLISH_SECRET:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      POCKETBASE_URL: ${POCKETBASE_URL:-https://pb.any1.tech}
      POCKETBASE_SERVER_TOKEN: ${POCKETBASE_SERVER_TOKEN:-}
      NEW_API_BASE_URL: ${NEW_API_BASE_URL:-https://new-api.active1.ccwu.cc}
      NEW_API_MODEL: ${NEW_API_MODEL:-}
      NEW_API_API_KEY: ${NEW_API_API_KEY:-}
      FUMADOCS_BASE_URL: ${FUMADOCS_BASE_URL:-}
      FUMADOCS_BLOB_UPLOAD_KEY: ${FUMADOCS_BLOB_UPLOAD_KEY:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-ActiveInsighter}
      GITHUB_REPO: ${GITHUB_REPO:-fumadocs-tecent}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MDTO_PDF_SUPABASE_URL: ${MDTO_PDF_SUPABASE_URL:-}
      MDTO_PDF_SUPABASE_SERVICE_KEY: ${MDTO_PDF_SUPABASE_SERVICE_KEY:-}
      MDTO_PDF_SUPABASE_USER_ID: ${MDTO_PDF_SUPABASE_USER_ID:-}
      MDTO_PDF_SUPABASE_BUCKET: ${MDTO_PDF_SUPABASE_BUCKET:-pdf-jobs}
      MDTO_PDF_THEME: ${MDTO_PDF_THEME:-chatgpt-light}
