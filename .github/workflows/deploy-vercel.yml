name: Deploy to Vercel and EdgeOne

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  quality:
    name: Shared checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployment_environment: ${{ steps.target.outputs.deployment_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Capture starting workflow Run ID
        uses: ./.github/actions/capture-run-metadata
        with:
          github_token: ${{ github.token }}
          recent_count: '10'
          phase: start
          outcome: in_progress

      - name: Resolve deployment environment
        id: target
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "deployment_environment=production" >> "${GITHUB_OUTPUT}"
          else
            echo "deployment_environment=preview" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate deployment configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          missing=0

          for name in \
            VERCEL_TOKEN \
            VERCEL_ORG_ID \
            VERCEL_PROJECT_ID \
            EDGEONE_API_TOKEN \
            EDGEONE_PROJECT_NAME
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions value: ${name}"
              missing=1
            fi
          done

          exit "${missing}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check project
        run: npm run typecheck

  vercel:
    name: Vercel ${{ needs.quality.outputs.deployment_environment }} deployment
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ENVIRONMENT: ${{ needs.quality.outputs.deployment_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest --no-audit --no-fund

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull \
            --yes \
            --environment="${VERCEL_ENVIRONMENT}" \
            --token="${VERCEL_TOKEN}"

      - name: Build Vercel output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${VERCEL_ENVIRONMENT}" = "production" ]; then
            vercel build --prod --token="${VERCEL_TOKEN}"
          else
            vercel build --token="${VERCEL_TOKEN}"
          fi

      - name: Deploy prebuilt Vercel output
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          args=(deploy --prebuilt --archive=tgz --token="${VERCEL_TOKEN}")
          if [ "${VERCEL_ENVIRONMENT}" = "production" ]; then
            args+=(--prod)
          fi

          deployment_url="$(vercel "${args[@]}")"
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "Deployment URL: ${deployment_url}"

      - name: Write Vercel deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Vercel deployment"
            echo
            echo "- Environment: \`${VERCEL_ENVIRONMENT}\`"
            echo "- Job status: \`${{ job.status }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            if [ -n "${{ steps.deploy.outputs.deployment_url }}" ]; then
              echo "- URL: ${{ steps.deploy.outputs.deployment_url }}"
            else
              echo "- URL: deployment did not complete"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  edgeone:
    name: EdgeOne ${{ needs.quality.outputs.deployment_environment }} deployment
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EDGEONE_ENVIRONMENT: ${{ needs.quality.outputs.deployment_environment }}
      EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install EdgeOne CLI
        run: |
          npm install --global edgeone@latest --no-audit --no-fund
          edgeone --version

      - name: Build and deploy with EdgeOne CLI
        id: deploy
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          set -uo pipefail

          deploy_project() {
            local project_name="$1"
            local deployment_environment="$2"
            edgeone makers deploy \
              -n "${project_name}" \
              -t "${EDGEONE_API_TOKEN}" \
              -e "${deployment_environment}" \
              2>&1 | tee edgeone-deploy.log
          }

          actual_project_name="${EDGEONE_PROJECT_NAME}"

          set +e
          deploy_project "${actual_project_name}" "${EDGEONE_ENVIRONMENT}"
          deploy_status=$?
          set -e

          if [ "${deploy_status}" -ne 0 ] \
            && grep -Fq "Provider 'Github'" edgeone-deploy.log \
            && grep -Fq "Only projects with Provider 'Upload'" edgeone-deploy.log; then
            actual_project_name="${EDGEONE_PROJECT_NAME}-upload"
            echo "::warning title=EdgeOne project type mismatch::${EDGEONE_PROJECT_NAME} is Git-connected, so CLI direct deployment will use ${actual_project_name} instead."

            set +e
            deploy_project "${actual_project_name}" "${EDGEONE_ENVIRONMENT}"
            deploy_status=$?
            set -e
          fi

          if [ "${deploy_status}" -ne 0 ]; then
            if [ "${EDGEONE_ENVIRONMENT}" = "preview" ] \
              && grep -Fq "Please create a production deployment first" edgeone-deploy.log; then
              echo "::warning title=Initializing EdgeOne production::${actual_project_name} has no production deployment yet. Creating it once before the requested preview deployment."
              deploy_project "${actual_project_name}" production
              deploy_project "${actual_project_name}" preview
            else
              exit "${deploy_status}"
            fi
          fi

          deployment_url="$(
            grep -Eo 'https://[^[:space:]]+' edgeone-deploy.log \
              | tail -n 1 \
              | sed -E 's/[),.;]+$//' \
              || true
          )"
          echo "project_name=${actual_project_name}" >> "${GITHUB_OUTPUT}"
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Write EdgeOne deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## EdgeOne Makers deployment"
            echo
            echo "- Environment: \`${EDGEONE_ENVIRONMENT}\`"
            if [ -n "${{ steps.deploy.outputs.project_name }}" ]; then
              echo "- Project: \`${{ steps.deploy.outputs.project_name }}\`"
            else
              echo "- Project: \`${EDGEONE_PROJECT_NAME}\`"
            fi
            echo "- Job status: \`${{ job.status }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            if [ -n "${{ steps.deploy.outputs.deployment_url }}" ]; then
              echo "- URL: ${{ steps.deploy.outputs.deployment_url }}"
            else
              echo "- URL: see the EdgeOne CLI log or Makers console"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  finalize:
    name: Finalize deployment metadata
    if: always()
    needs:
      - quality
      - vercel
      - edgeone
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve overall workflow outcome
        id: outcome
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          VERCEL_RESULT: ${{ needs.vercel.result }}
          EDGEONE_RESULT: ${{ needs.edgeone.result }}
        run: |
          set -euo pipefail

          results="${QUALITY_RESULT} ${VERCEL_RESULT} ${EDGEONE_RESULT}"
          if [[ " ${results} " == *" failure "* ]]; then
            outcome=failure
          elif [[ " ${results} " == *" cancelled "* ]]; then
            outcome=cancelled
          elif [ "${QUALITY_RESULT}" = "success" ] \
            && [ "${VERCEL_RESULT}" = "success" ] \
            && [ "${EDGEONE_RESULT}" = "success" ]; then
            outcome=success
          else
            outcome=skipped
          fi

          echo "outcome=${outcome}" >> "${GITHUB_OUTPUT}"

      - name: Refresh completed workflow Run ID
        uses: ./.github/actions/capture-run-metadata
        with:
          github_token: ${{ github.token }}
          recent_count: '10'
          phase: complete
          outcome: ${{ steps.outcome.outputs.outcome }}

      - name: Write combined deployment summary
        shell: bash
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ needs.quality.outputs.deployment_environment }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          VERCEL_RESULT: ${{ needs.vercel.result }}
          EDGEONE_RESULT: ${{ needs.edgeone.result }}
          OVERALL_OUTCOME: ${{ steps.outcome.outputs.outcome }}
        run: |
          {
            echo "## Parallel deployment result"
            echo
            echo "- Environment: \`${DEPLOYMENT_ENVIRONMENT:-unknown}\`"
            echo "- Overall outcome: \`${OVERALL_OUTCOME}\`"
            echo "- GitHub run ID: [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Shared checks | \`${QUALITY_RESULT}\` |"
            echo "| Vercel | \`${VERCEL_RESULT}\` |"
            echo "| EdgeOne Makers | \`${EDGEONE_RESULT}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail when a required job failed
        if: steps.outcome.outputs.outcome != 'success'
        shell: bash
        run: |
          echo "::error::One or more required deployment jobs did not complete successfully."
          exit 1
