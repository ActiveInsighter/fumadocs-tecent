name: Deploy to Vercel

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vercel-${{ github.ref_name }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }} deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'preview' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Capture workflow run ID
        id: run_metadata
        uses: ./.github/actions/capture-run-metadata
        with:
          github_token: ${{ github.token }}
          recent_count: '10'

      - name: Validate deployment secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          missing=0

          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              missing=1
            fi
          done

          exit "${missing}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest --no-audit --no-fund

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull \
            --yes \
            --environment="${VERCEL_ENVIRONMENT}" \
            --token="${VERCEL_TOKEN}"

      - name: Build Vercel output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${VERCEL_ENVIRONMENT}" = "production" ]; then
            vercel build --prod --token="${VERCEL_TOKEN}"
          else
            vercel build --token="${VERCEL_TOKEN}"
          fi

      - name: Deploy prebuilt output
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          args=(deploy --prebuilt --archive=tgz --token="${VERCEL_TOKEN}")
          if [ "${VERCEL_ENVIRONMENT}" = "production" ]; then
            args+=(--prod)
          fi

          deployment_url="$(vercel "${args[@]}")"
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "Deployment URL: ${deployment_url}"

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Vercel deployment"
            echo
            echo "- Environment: \`${VERCEL_ENVIRONMENT}\`"
            echo "- GitHub run ID: \`${{ steps.run_metadata.outputs.run_id }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            if [ -n "${{ steps.deploy.outputs.deployment_url }}" ]; then
              echo "- URL: ${{ steps.deploy.outputs.deployment_url }}"
            else
              echo "- URL: deployment did not complete"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
