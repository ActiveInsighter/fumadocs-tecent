name: Verify production workflow

on:
  push:
    branches:
      - chore/verify-production-deployment

permissions:
  contents: write
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v6

      - name: Capture latest workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 601bf47b1cbcbb385865b95e6ebc5b4c90762b45
        run: |
          set -euo pipefail
          sleep 25
          mkdir -p .verification

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" \
            | jq --arg target_sha "${TARGET_SHA}" '{
                captured_at: (now | todate),
                target_sha: $target_sha,
                matching_runs: [
                  .workflow_runs[]
                  | select(.head_sha == $target_sha and .event == "push")
                  | {
                      id,
                      name,
                      status,
                      conclusion,
                      run_number,
                      run_attempt,
                      head_branch,
                      head_sha,
                      html_url,
                      created_at,
                      updated_at
                    }
                ]
              }' > .verification/latest-runs.json

      - name: Commit verification result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .verification/latest-runs.json
          git commit -m "chore: record production run [skip ci]"
          git push
