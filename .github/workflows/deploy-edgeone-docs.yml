name: Deploy Fumadocs to EdgeOne

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fumadocs-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EDGEONE_CLI_VERSION: 1.6.31-3
  EDGEONE_DOCS_PROJECT_NAME: ${{ vars.EDGEONE_DOCS_PROJECT_NAME }}

jobs:
  deploy:
    name: Deploy pure static Fumadocs site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

    steps:
      - name: Mark pipeline start
        shell: bash
        run: |
          echo "PIPELINE_STARTED_AT=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore project dependency tree
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}

      - name: Restore npm download cache on dependency miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-v1-${{ hashFiles('package-lock.json') }}

      - name: Install project dependencies on cache miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          npm ci --no-audit --no-fund
          echo "- Dependency install: $(($(date +%s) - started))s (cache miss)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Refresh Fumadocs generated source
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          npm run postinstall
          {
            echo "- node_modules cache hit: ${{ steps.node-modules-cache.outputs.cache-hit }}"
            echo "- Fumadocs source refresh: $(($(date +%s) - started))s"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run static docs tests
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          npm test -- tests/static-docs-build.test.ts
          echo "- Static/search tests: $(($(date +%s) - started))s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Restore Next/Turbopack build cache
        uses: actions/cache@v5
        with:
          path: .static-docs-stage/.next/cache
          key: ${{ runner.os }}-static-docs-turbopack-v4-${{ hashFiles('package-lock.json', 'next.config.static.mjs', 'source.config.ts', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-static-docs-turbopack-v4-${{ hashFiles('package-lock.json', 'next.config.static.mjs', 'source.config.ts', 'tsconfig.json') }}-
            ${{ runner.os }}-static-docs-turbopack-v4-
            ${{ runner.os }}-static-docs-turbopack-v3-

      - name: Restore EdgeOne CLI
        id: edgeone-cache
        uses: actions/cache@v5
        with:
          path: .edgeone-cli
          key: ${{ runner.os }}-node22-edgeone-cli-v1-${{ env.EDGEONE_CLI_VERSION }}

      - name: Install EdgeOne CLI on cache miss
        if: steps.edgeone-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          npm install --global --prefix "${GITHUB_WORKSPACE}/.edgeone-cli" \
            "edgeone@${EDGEONE_CLI_VERSION}" --no-audit --no-fund
          echo "- EdgeOne CLI install: $(($(date +%s) - started))s (cache miss)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          echo "${GITHUB_WORKSPACE}/.edgeone-cli/bin" >> "${GITHUB_PATH}"
          [[ -x "${GITHUB_WORKSPACE}/.edgeone-cli/bin/edgeone" ]] || {
            echo '::error::EdgeOne CLI executable is missing.'
            exit 1
          }
          [[ -n "${EDGEONE_API_TOKEN:-}" ]] || {
            echo '::error::Missing GitHub Actions secret: EDGEONE_API_TOKEN'
            exit 1
          }
          [[ -n "${EDGEONE_DOCS_PROJECT_NAME:-}" ]] || {
            echo '::error::Missing GitHub Actions variable: EDGEONE_DOCS_PROJECT_NAME'
            exit 1
          }
          edgeone --version
          echo "- EdgeOne CLI cache hit: ${{ steps.edgeone-cache.outputs.cache-hit }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build docs and ZBSearch in parallel
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          npm run build:static-docs 2>&1 | tee static-docs-build.log
          wall_seconds="$(($(date +%s) - started))"
          {
            echo "- Static package wall time: ${wall_seconds}s"
            grep '^\[timing\]' static-docs-build.log | sed 's/^/- /' || true
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify zero-function and search artifacts
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          test -d .static-docs

          if find .static-docs -type d \( -name cloud-functions -o -name edge-functions \) -print -quit | grep -q .; then
            echo '::error::A Functions directory exists in the static deployment artifact.'
            exit 1
          fi
          if find .static-docs -type f \( -path '*/cloud-functions/*' -o -path '*/edge-functions/*' \) -print -quit | grep -q .; then
            echo '::error::A Functions file exists in the static deployment artifact.'
            exit 1
          fi

          manifest='.static-docs/search-index.json'
          test -s "${manifest}"
          [[ "$(jq -r '.version' "${manifest}")" == '4' ]]
          [[ "$(jq -r '.engine' "${manifest}")" == 'zbsearch' ]]
          [[ "$(jq -r '.mode' "${manifest}")" == 'category-bloom-router-shards' ]]

          search_file_count=1
          search_bytes="$(stat -c '%s' "${manifest}")"
          router_count=0
          core_count=0
          body_count=0

          check_search_file() {
            local url="$1"
            local file_path=".static-docs${url}"
            test -s "${file_path}" || { echo "::error::Missing search file: ${file_path}"; exit 1; }
            local bytes
            bytes="$(stat -c '%s' "${file_path}")"
            (( bytes < 25000000 )) || { echo "::error::Search file ${file_path} is at or above 25 MB."; exit 1; }
            search_bytes="$((search_bytes + bytes))"
            search_file_count="$((search_file_count + 1))"
          }

          while IFS= read -r router_url; do
            router_count="$((router_count + 1))"
            check_search_file "${router_url}"
            router_path=".static-docs${router_url}"
            [[ "$(jq -r '.version' "${router_path}")" == '2' ]]
            [[ "$(jq -r '.engine' "${router_path}")" == 'zbsearch' ]]

            while IFS= read -r core_url; do
              core_count="$((core_count + 1))"
              check_search_file "${core_url}"
            done < <(jq -r '.core[].url' "${router_path}")

            while IFS= read -r body_url; do
              body_count="$((body_count + 1))"
              check_search_file "${body_url}"
            done < <(jq -r '.body[].url' "${router_path}")
          done < <(jq -r '.categories[].router.url' "${manifest}")

          [[ "${router_count}" -gt 0 && "${core_count}" -gt 0 && "${body_count}" -gt 0 ]]

          package_bytes="$(du -sb .static-docs | awk '{print $1}')"
          file_count="$(find .static-docs -type f | wc -l | tr -d ' ')"
          largest_file="$({ find .static-docs -type f -printf '%s %p\n' | sort -nr | head -n 1; } || true)"
          largest_bytes="${largest_file%% *}"
          (( largest_bytes < 25000000 )) || { echo '::error::A static file is at or above the EdgeOne 25 MB limit.'; exit 1; }

          {
            echo '- Cloud Functions: 0'
            echo '- Edge Functions: 0'
            echo "- Static files: ${file_count}"
            echo "- Static output: $((package_bytes / 1024 / 1024)) MiB"
            echo "- Search files: ${search_file_count}; raw total $((search_bytes / 1024 / 1024)) MiB"
            echo "- Search routers/core/body: ${router_count}/${core_count}/${body_count}"
            echo "- Largest file: ${largest_file}"
            echo "- Artifact validation: $(($(date +%s) - started))s"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Package pure static deployment
        shell: bash
        run: |
          set -euo pipefail
          zip_path="${RUNNER_TEMP}/fumadocs-static-production.zip"
          rm -f -- "${zip_path}"
          started="$(date +%s)"
          (cd .static-docs && zip -qr -6 "${zip_path}" .)
          finished="$(date +%s)"
          zip_bytes="$(stat -c '%s' "${zip_path}")"
          echo "STATIC_DEPLOY_ZIP=${zip_path}" >> "${GITHUB_ENV}"
          echo "- Deployment ZIP: $((zip_bytes / 1024 / 1024)) MiB; packaging $((finished - started))s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy prebuilt static site to EdgeOne
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          max_attempts=3
          attempt=1

          while :; do
            : > edgeone-static-production.log
            echo "EdgeOne deployment attempt ${attempt}/${max_attempts}"

            if edgeone makers deploy "${STATIC_DEPLOY_ZIP}" \
              -n "${EDGEONE_DOCS_PROJECT_NAME}" \
              -t "${EDGEONE_API_TOKEN}" \
              -e production \
              --site global \
              --json \
              2>&1 | tee edgeone-static-production.log; then
              break
            fi

            if ! grep -Eqi 'timeout|timed out|ETIMEDOUT|ECONNRESET|EAI_AGAIN|ENOTFOUND|socket hang up|check and set region failed|HTTP[^0-9]*5[0-9]{2}|status[^0-9]*5[0-9]{2}' edgeone-static-production.log; then
              echo '::error::EdgeOne deployment failed with a non-transient error; skipping retries.'
              exit 1
            fi
            if (( attempt >= max_attempts )); then
              echo "::error::EdgeOne deployment still failed after ${max_attempts} attempts."
              exit 1
            fi

            retry_delay=$((attempt * 3))
            echo "::warning::Transient EdgeOne deployment error; retrying in ${retry_delay}s."
            sleep "${retry_delay}"
            attempt=$((attempt + 1))
          done

          finished="$(date +%s)"
          echo "- EdgeOne deploy: $((finished - started))s; attempts ${attempt}/${max_attempts}" >> "${GITHUB_STEP_SUMMARY}"

          deployment_json="$(grep -Eo '\{"status":"success".*' edgeone-static-production.log | tail -n 1)"
          deployment_url="$(printf '%s' "${deployment_json}" | jq -r '.url // empty')"
          console_url="$(printf '%s' "${deployment_json}" | jq -r '.consoleUrl // empty')"
          [[ -n "${deployment_url}" ]] || { echo '::error::No deployment URL captured.'; exit 1; }
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "console_url=${console_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify production pages and search routes
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$(mktemp -d)"
          trap 'rm -rf -- "${probe_dir}"' EXIT
          started="$(date +%s)"

          manifest='.static-docs/search-index.json'
          router_url="$(jq -r '.categories[0].router.url' "${manifest}")"
          router_path=".static-docs${router_url}"
          core_url="$(jq -r '.core[0].url' "${router_path}")"
          body_url="$(jq -r '.body[0].url' "${router_path}")"

          pids=()
          start_probe() {
            local name="$1"
            local path="$2"
            (
              curl --silent --show-error --max-time 60 -L -o /dev/null -w '%{http_code}' \
                "https://fumadocs.any1.tech${path}" > "${probe_dir}/${name}.status"
            ) &
            pids+=("$!")
          }

          start_probe home '/'
          start_probe docs '/docs/'
          start_probe math '/docs/math/advanced-mathematics/01-limits-continuity/'
          start_probe markdown '/docs/math/advanced-mathematics/01-limits-continuity.md'
          start_probe search_manifest '/search-index.json'
          start_probe search_router "${router_url}"
          start_probe search_core "${core_url}"
          start_probe search_body "${body_url}"
          start_probe retired_upload '/api/blob/upload-url'
          start_probe retired_ingest '/api/integrations/anyworkflow'
          start_probe retired_download '/download/tasks/probe/1/probe/md'

          for pid in "${pids[@]}"; do wait "${pid}"; done

          for name in home docs math markdown search_manifest search_router search_core search_body; do
            status="$(cat "${probe_dir}/${name}.status")"
            echo "${name}=${status}"
            [[ "${status}" == '200' ]]
          done
          for name in retired_upload retired_ingest retired_download; do
            status="$(cat "${probe_dir}/${name}.status")"
            echo "${name}=${status}"
            [[ "${status}" == '404' ]]
          done

          echo "- Parallel production route verification: $(($(date +%s) - started))s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify CDN compression and cache
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          manifest='.static-docs/search-index.json'
          router_url="$(jq -r '.categories[0].router.url' "${manifest}")"
          router_path=".static-docs${router_url}"
          body_url="$(jq -r '.body[0].url' "${router_path}")"

          verify_compressed() {
            local label="$1"
            local url="$2"
            local headers_file
            headers_file="$(mktemp)"
            trap 'rm -f -- "${headers_file}"' RETURN

            for attempt in 1 2 3 4 5 6; do
              : > "${headers_file}"
              curl --http1.1 --compressed --silent --show-error --max-time 60 \
                -H 'Accept-Encoding: br, gzip' -D "${headers_file}" -o /dev/null "${url}"
              encoding="$(awk -F': *' 'tolower($1)=="content-encoding" {gsub(/\r/,"",$2); v=$2} END{print v}' "${headers_file}")"
              cache_control="$(awk -F': *' 'tolower($1)=="cache-control" {gsub(/\r/,"",$2); v=$2} END{print v}' "${headers_file}")"
              edge_cache="$(awk -F': *' 'tolower($1)=="eo-cache-status" {gsub(/\r/,"",$2); v=$2} END{print v}' "${headers_file}")"
              echo "${label}: attempt=${attempt} encoding=${encoding:-none} cache=${edge_cache:-none}"
              [[ "${cache_control}" != *private* && "${cache_control}" != *no-store* ]] || return 1
              if [[ "${encoding}" == 'br' || "${encoding}" == 'gzip' ]]; then return 0; fi
              sleep 2
            done
            return 1
          }

          verify_compressed docs 'https://fumadocs.any1.tech/docs/408'
          verify_compressed search "https://fumadocs.any1.tech${body_url}"
          echo "- CDN docs/search compression verification: $(($(date +%s) - started))s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          finished="$(date +%s)"
          total_seconds="$((finished - ${PIPELINE_STARTED_AT:-finished}))"
          {
            echo '## EdgeOne Fumadocs pure-static deployment'
            echo
            echo "- Project: ${EDGEONE_DOCS_PROJECT_NAME}"
            echo '- Runtime: static CDN only; Cloud Functions 0; Edge Functions 0'
            echo "- Job status: ${{ job.status }}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Pipeline wall time (first step → final verification): ${total_seconds}s"
            if [ -n "${{ steps.deploy.outputs.console_url }}" ]; then
              echo "- Console: ${{ steps.deploy.outputs.console_url }}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
