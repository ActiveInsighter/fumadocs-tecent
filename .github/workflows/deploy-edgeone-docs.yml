name: Deploy Fumadocs to EdgeOne

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fumadocs-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EDGEONE_CLI_VERSION: 1.6.31-3
  EDGEONE_PAGES_API_URL: https://pages-api.cloud.tencent.com/v1
  EDGEONE_DOCS_PROJECT_ID: makers-nycxgnmbk5ft
  EDGEONE_DOCS_PROJECT_NAME: ${{ vars.EDGEONE_DOCS_PROJECT_NAME }}
  NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ vars.NEXT_PUBLIC_ALGOLIA_APP_ID }}
  NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${{ vars.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
  NEXT_PUBLIC_ALGOLIA_INDEX_NAME: ${{ vars.NEXT_PUBLIC_ALGOLIA_INDEX_NAME }}

jobs:
  deploy:
    name: Deploy Fumadocs site
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore npm download cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-v1-${{ hashFiles('package-lock.json') }}

      - name: Restore EdgeOne CLI
        id: edgeone-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/edgeone-cli
          key: ${{ runner.os }}-node22-edgeone-cli-v1-${{ env.EDGEONE_CLI_VERSION }}

      - name: Install EdgeOne CLI on cache miss
        if: steps.edgeone-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          install_started="$(date +%s)"
          npm install --global --prefix "${HOME}/.local/edgeone-cli" \
            "edgeone@${EDGEONE_CLI_VERSION}" --no-audit --no-fund
          install_finished="$(date +%s)"
          echo "- EdgeOne CLI install: $((install_finished - install_started))s (cache miss)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure EdgeOne CLI
        shell: bash
        run: |
          set -euo pipefail
          echo "${HOME}/.local/edgeone-cli/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/edgeone-cli/bin:${PATH}"
          edgeone --version
          echo "- EdgeOne CLI cache hit: ${{ steps.edgeone-cache.outputs.cache-hit }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Restore Next/Turbopack build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-production-next-v1-${{ hashFiles('package-lock.json', 'next.config.mjs', 'source.config.ts', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-production-next-v1-${{ hashFiles('package-lock.json', 'next.config.mjs', 'source.config.ts', 'tsconfig.json') }}-
            ${{ runner.os }}-production-next-v1-

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in EDGEONE_API_TOKEN EDGEONE_DOCS_PROJECT_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions value: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Build the Fumadocs application locally
        shell: bash
        run: |
          set -euo pipefail
          build_started="$(date +%s)"
          edgeone makers build --mode prod \
            2>&1 \
            | sed -u -E 's/(eo_token=)[^&[:space:]]+/\1REDACTED/g; s/(sb_(publishable|secret)_[A-Za-z0-9_-]+|sk-[A-Za-z0-9_-]+)/REDACTED/g' \
            | tee edgeone-docs-build.log
          build_finished="$(date +%s)"
          echo "- Production EdgeOne build: $((build_finished - build_started))s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Reduce the EdgeOne SSR bundle footprint
        shell: bash
        run: node scripts/prune-edgeone-prerendered.mjs

      - name: Check EdgeOne upload footprint
        shell: bash
        run: |
          set -euo pipefail

          function_bytes="$(du -sb .edgeone/cloud-functions | awk '{print $1}')"
          asset_bytes="$(du -sb .edgeone/assets | awk '{print $1}')"
          largest_file="$({ find .edgeone -type f -printf '%s %p\n' | sort -nr | head -n 1; } || true)"

          echo "cloud_functions_bytes=${function_bytes}"
          echo "assets_bytes=${asset_bytes}"
          echo "largest_file=${largest_file}"
          {
            echo "- Cloud Functions: ${function_bytes} bytes"
            echo "- Static assets: ${asset_bytes} bytes"
            echo "- Largest upload file: ${largest_file}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if (( function_bytes >= 128000000 )); then
            echo "::error::Cloud Functions output is at or above EdgeOne's 128 MB limit."
            exit 1
          fi

          largest_bytes="${largest_file%% *}"
          if (( largest_bytes >= 25000000 )); then
            echo '::error::An EdgeOne upload file is at or above the 25 MB limit.'
            exit 1
          fi

      - name: Package EdgeOne deployment as ZIP
        shell: bash
        run: |
          set -euo pipefail

          deploy_zip="${RUNNER_TEMP}/fumadocs-edgeone-production.zip"
          raw_bytes="$(du -sb .edgeone | awk '{print $1}')"
          file_count="$(find .edgeone -type f | wc -l | tr -d ' ')"
          zip_started="$(date +%s)"
          (
            cd .edgeone
            zip -qr -9 "${deploy_zip}" .
          )
          zip_finished="$(date +%s)"
          zip_bytes="$(stat -c '%s' "${deploy_zip}")"

          echo "EDGEONE_DEPLOY_ZIP=${deploy_zip}" >> "${GITHUB_ENV}"
          echo "edgeone_raw_bytes=${raw_bytes}"
          echo "edgeone_file_count=${file_count}"
          echo "edgeone_zip_bytes=${zip_bytes}"
          echo "edgeone_zip_seconds=$((zip_finished - zip_started))"
          {
            echo "- EdgeOne raw artifact: ${raw_bytes} bytes (${file_count} files)"
            echo "- EdgeOne ZIP artifact: ${zip_bytes} bytes"
            echo "- EdgeOne ZIP packaging: $((zip_finished - zip_started))s"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure Fumadocs runtime variables
        shell: bash
        env:
          EDGEONE_INTERNAL_API_KEY: ${{ secrets.EDGEONE_INTERNAL_API_KEY }}
          EDGEONE_DOWNLOAD_GATEWAY_SECRET: ${{ secrets.EDGEONE_DOWNLOAD_GATEWAY_SECRET }}
          N8N_DOCUMENT_PUBLISH_SECRET: ${{ secrets.N8N_DOCUMENT_PUBLISH_SECRET }}
          FUMADOCS_BLOB_UPLOAD_KEY: ${{ secrets.FUMADOCS_BLOB_UPLOAD_KEY }}
        run: |
          set -euo pipefail

          api_tmp="$(mktemp -d)"
          trap 'rm -rf -- "${api_tmp}"' EXIT
          response_file="${api_tmp}/modify-pages-project-envs.json"

          jq -cn \
            --arg project_id "${EDGEONE_DOCS_PROJECT_ID}" \
            --arg n8n_secret "${N8N_DOCUMENT_PUBLISH_SECRET}" \
            --arg upload_key "${FUMADOCS_BLOB_UPLOAD_KEY}" \
            --arg signer_secret "${EDGEONE_INTERNAL_API_KEY}" \
            --arg gateway_secret "${EDGEONE_DOWNLOAD_GATEWAY_SECRET}" \
            '{
              Action: "ModifyPagesProjectEnvs",
              ProjectId: $project_id,
              EnvVars: [
                {Key: "POCKETBASE_URL", Value: "https://pb.any1.tech"},
                {Key: "N8N_DOCUMENT_PUBLISH_URL", Value: "https://n8n.any1.tech/webhook/anyworkflow-task-enrich"},
                {Key: "N8N_DOCUMENT_PUBLISH_SECRET", Value: $n8n_secret},
                {Key: "FUMADOCS_BLOB_UPLOAD_KEY", Value: $upload_key},
                {Key: "BLOB_SIGNER_URL", Value: "https://fumadocs-upload.any1.tech/api/blob/upload-url"},
                {Key: "BLOB_SIGNER_SECRET", Value: $signer_secret},
                {Key: "BLOB_DOWNLOAD_GATEWAY_URL", Value: "https://fumadocs-upload.any1.tech/download"},
                {Key: "BLOB_DOWNLOAD_GATEWAY_SECRET", Value: $gateway_secret}
              ]
            }' \
            | curl --http1.1 --retry 3 --retry-all-errors --retry-delay 2 \
                --silent --show-error --fail-with-body --max-time 30 \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
                --data-binary @- \
                --output "${response_file}" \
                "${EDGEONE_PAGES_API_URL}"

          if ! jq -e '((.Code // .Data.Response.Code // .Data.Code // 0) == 0) and ((.Error // .Data.Response.Error // .Data.Error) == null)' "${response_file}" >/dev/null; then
            echo '::error::EdgeOne runtime variable update failed.'
            exit 1
          fi

      - name: Verify Fumadocs runtime variables
        shell: bash
        run: |
          set -euo pipefail

          api_tmp="$(mktemp -d)"
          trap 'rm -rf -- "${api_tmp}"' EXIT
          response_file="${api_tmp}/describe-pages-project-envs.json"

          jq -cn \
            --arg project_id "${EDGEONE_DOCS_PROJECT_ID}" \
            '{Action: "DescribePagesProjectEnvs", ProjectId: $project_id}' \
            | curl --http1.1 --retry 3 --retry-all-errors --retry-delay 2 \
                --silent --show-error --fail-with-body --max-time 30 \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
                --data-binary @- \
                --output "${response_file}" \
                "${EDGEONE_PAGES_API_URL}"

          api_env_present() {
            local name="$1"
            jq -e --arg name "${name}" '
              (.Data.Response // .Data // .)
              | (.EnvVars // [])
              | any(.[]; .Key == $name and ((.Value // "") | length > 0))
            ' "${response_file}" >/dev/null
          }

          missing=0
          for name in \
            POCKETBASE_URL \
            N8N_DOCUMENT_PUBLISH_URL \
            N8N_DOCUMENT_PUBLISH_SECRET \
            FUMADOCS_BLOB_UPLOAD_KEY \
            BLOB_SIGNER_URL \
            BLOB_SIGNER_SECRET \
            BLOB_DOWNLOAD_GATEWAY_URL \
            BLOB_DOWNLOAD_GATEWAY_SECRET; do
            if api_env_present "${name}"; then
              echo "${name}=present"
            else
              echo "::error::Missing or empty EdgeOne runtime variable: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Deploy the prebuilt Fumadocs application
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_started="$(date +%s)"

          edgeone makers deploy "${EDGEONE_DEPLOY_ZIP}" \
            -n "${EDGEONE_DOCS_PROJECT_NAME}" \
            -t "${EDGEONE_API_TOKEN}" \
            -e production \
            --site global \
            2>&1 \
            | sed -u -E 's/(eo_token=)[^&[:space:]]+/\1REDACTED/g; s/(sb_(publishable|secret)_[A-Za-z0-9_-]+|sk-[A-Za-z0-9_-]+)/REDACTED/g' \
            | tee edgeone-docs-deploy.log

          deploy_finished="$(date +%s)"
          echo "- EdgeOne deploy: $((deploy_finished - deploy_started))s" >> "${GITHUB_STEP_SUMMARY}"

          deployment_url="$(
            grep -Eo 'Deploy URL: https://[^[:space:]]+' edgeone-docs-deploy.log \
              | tail -n 1 \
              | sed -E 's/^Deploy URL: //; s/\?.*$//; s/[),.;]+$//' \
              || true
          )"
          console_url="$(
            grep -Eo 'Console URL: https://[^[:space:]]+' edgeone-docs-deploy.log \
              | tail -n 1 \
              | sed -E 's/^Console URL: //; s/[),.;]+$//' \
              || true
          )"
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "console_url=${console_url}" >> "${GITHUB_OUTPUT}"

      - name: Diagnose failed EdgeOne deployment
        if: ${{ always() && steps.deploy.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail

          api_tmp="$(mktemp -d)"
          trap 'rm -rf -- "${api_tmp}"' EXIT
          response_file="${api_tmp}/describe-pages-deployments.json"

          jq -cn \
            --arg project_id "${EDGEONE_DOCS_PROJECT_ID}" \
            '{
              Action: "DescribePagesDeployments",
              ProjectId: $project_id,
              Offset: 0,
              Limit: 10,
              OrderBy: "CreatedOn",
              Order: "Desc"
            }' \
            | curl --http1.1 --retry 3 --retry-all-errors --retry-delay 2 \
                --silent --show-error --fail-with-body --max-time 30 \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
                --data-binary @- \
                --output "${response_file}" \
                "${EDGEONE_PAGES_API_URL}"

          jq '{
            code: .Code,
            message: .Message,
            requestId: .RequestId,
            deployments: ((.Data.Response.Deployments // []) | map({
              deploymentId: .DeploymentId,
              status: .Status,
              environment: .Env,
              usedInProd: .UsedInProd,
              createdOn: .CreatedOn,
              updatedOn: .UpdatedOn,
              error: (.Error // .ErrorMessage // .FailReason // .Reason // null),
              message: .Message
            }))
          }' "${response_file}"

      - name: Check EdgeOne custom domain binding
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const endpoint = process.env.EDGEONE_PAGES_API_URL;
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.EDGEONE_API_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              Action: 'DescribePagesZoneCustomDomains',
              ProjectId: process.env.EDGEONE_DOCS_PROJECT_ID,
            }),
          });
          if (!response.ok) throw new Error(`EdgeOne domain query returned HTTP ${response.status}`);
          const payload = await response.json();
          const pagesDomains = payload?.Data?.Response?.PagesDomains ?? [];
          const customDomain = pagesDomains.find(
            (item) => item?.Type === 'Custom' && item?.Domain === 'fumadocs.any1.tech',
          );
          console.log(JSON.stringify(pagesDomains.map((item) => ({
            Domain: item?.Domain,
            Type: item?.Type,
            Status: item?.Status,
            CurrentCname: item?.CurrentCname,
            Cname: item?.Cname,
            MainDomain: item?.MainDomain,
            Env: item?.Env,
          })), null, 2));
          if (!customDomain) throw new Error('fumadocs.any1.tech is not attached to the EdgeOne docs project.');
          NODE

      - name: Verify public EdgeOne routes
        shell: bash
        run: |
          set -euo pipefail

          status_for() {
            local method="$1"
            local url="$2"
            curl --fail-with-body --silent --show-error --max-time 30 \
              --request "${method}" \
              -o /dev/null \
              -w '%{http_code}' \
              "${url}" || true
          }

          homepage_status="$(status_for GET 'https://fumadocs.any1.tech/')"
          signer_status="$(status_for POST 'https://fumadocs.any1.tech/api/blob/upload-url')"
          download_status="$(status_for GET 'https://fumadocs.any1.tech/download/edgeone-verification-probe/1/md')"

          echo "homepage=${homepage_status}"
          echo "signer_without_key=${signer_status}"
          echo "download_missing_artifact=${download_status}"

          [[ "${homepage_status}" == "200" ]]
          [[ "${signer_status}" == "401" ]]
          [[ "${download_status}" == "404" ]]

      - name: Verify static HTML compression and CDN cache
        shell: bash
        run: |
          set -euo pipefail

          probe_dir="$(mktemp -d)"
          trap 'rm -rf -- "${probe_dir}"' EXIT
          warmup_headers_file="${probe_dir}/warmup-headers.txt"
          headers_file="${probe_dir}/headers.txt"

          warmup_status="$(
            curl --http1.1 --compressed \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --silent --show-error --max-time 30 \
              -H 'Accept-Encoding: br, gzip' \
              -D "${warmup_headers_file}" \
              -o /dev/null \
              -w '%{http_code}' \
              'https://fumadocs.any1.tech/docs/408'
          )"
          echo "static_docs_warmup_status=${warmup_status}"

          curl --http1.1 --compressed \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --silent --show-error --max-time 30 \
            -H 'Accept-Encoding: br, gzip' \
            -D "${headers_file}" \
            -o /dev/null \
            -w 'static_docs_status=%{http_code}\nstatic_docs_ttfb=%{time_starttransfer}\nstatic_docs_total=%{time_total}\nstatic_docs_bytes=%{size_download}\n' \
            'https://fumadocs.any1.tech/docs/408'

          header_value() {
            local key="$1"
            awk -F': *' -v key="${key}" '
              tolower($1) == tolower(key) {
                sub(/\r$/, "", $2)
                value = $2
              }
              END { print value }
            ' "${headers_file}"
          }

          status="$(awk '$1 ~ /^HTTP\// { code = $2 } END { print code }' "${headers_file}")"
          content_type="$(header_value 'Content-Type')"
          content_encoding="$(header_value 'Content-Encoding')"
          cache_control="$(header_value 'Cache-Control')"
          edge_cache_status="$(header_value 'EO-Cache-Status')"

          echo "static_docs_content_type=${content_type}"
          echo "static_docs_content_encoding=${content_encoding}"
          echo "static_docs_cache_control=${cache_control}"
          echo "static_docs_edge_cache_status=${edge_cache_status}"

          [[ "${warmup_status}" == "200" ]]
          [[ "${status}" == "200" ]]
          [[ "${content_type}" == text/html* ]]
          [[ "${content_encoding}" == 'br' || "${content_encoding}" == 'gzip' ]]
          [[ "${cache_control}" != *private* && "${cache_control}" != *no-store* ]]
          [[ "${edge_cache_status}" == 'Cache Hit' ]]

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## EdgeOne Fumadocs deployment"
            echo
            echo "- Project: \`${EDGEONE_DOCS_PROJECT_NAME}\`"
            echo "- Environment: \`production\`"
            echo "- Job status: \`${{ job.status }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            if [ -n "${{ steps.deploy.outputs.deployment_url }}" ]; then
              echo "- Site endpoint: ${{ steps.deploy.outputs.deployment_url }}"
            fi
            if [ -n "${{ steps.deploy.outputs.console_url }}" ]; then
              echo "- Console: ${{ steps.deploy.outputs.console_url }}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
