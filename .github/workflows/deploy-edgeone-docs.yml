name: Deploy Fumadocs to EdgeOne

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fumadocs-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EDGEONE_CLI_VERSION: 1.6.31-3
  EDGEONE_DOCS_PROJECT_NAME: ${{ vars.EDGEONE_DOCS_PROJECT_NAME }}

jobs:
  deploy:
    name: Deploy pure static Fumadocs site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore project dependency tree
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}

      - name: Restore npm download cache on dependency miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-v1-${{ hashFiles('package-lock.json') }}

      - name: Install project dependencies on cache miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Refresh Fumadocs generated source
        shell: bash
        run: |
          set -euo pipefail
          npm run postinstall
          echo "- node_modules cache hit: ${{ steps.node-modules-cache.outputs.cache-hit }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Restore Next/Turbopack build cache
        uses: actions/cache@v5
        with:
          path: .static-docs-stage/.next/cache
          key: ${{ runner.os }}-static-docs-turbopack-v3-${{ hashFiles('package-lock.json', 'next.config.static.mjs', 'source.config.ts', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-static-docs-turbopack-v3-${{ hashFiles('package-lock.json', 'next.config.static.mjs', 'source.config.ts', 'tsconfig.json') }}-
            ${{ runner.os }}-static-docs-turbopack-v3-
            ${{ runner.os }}-static-docs-turbopack-v2-

      - name: Restore EdgeOne CLI
        id: edgeone-cache
        uses: actions/cache@v5
        with:
          path: .edgeone-cli
          key: ${{ runner.os }}-node22-edgeone-cli-v1-${{ env.EDGEONE_CLI_VERSION }}

      - name: Install EdgeOne CLI on cache miss
        if: steps.edgeone-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "${GITHUB_WORKSPACE}/.edgeone-cli" \
            "edgeone@${EDGEONE_CLI_VERSION}" --no-audit --no-fund

      - name: Configure deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/.edgeone-cli/bin:${PATH}"
          echo "${GITHUB_WORKSPACE}/.edgeone-cli/bin" >> "${GITHUB_PATH}"
          [[ -x "${GITHUB_WORKSPACE}/.edgeone-cli/bin/edgeone" ]] || {
            echo '::error::EdgeOne CLI executable is missing.'
            exit 1
          }
          [[ -n "${EDGEONE_API_TOKEN:-}" ]] || {
            echo '::error::Missing GitHub Actions secret: EDGEONE_API_TOKEN'
            exit 1
          }
          [[ -n "${EDGEONE_DOCS_PROJECT_NAME:-}" ]] || {
            echo '::error::Missing GitHub Actions variable: EDGEONE_DOCS_PROJECT_NAME'
            exit 1
          }
          edgeone --version
          echo "- EdgeOne CLI cache hit: ${{ steps.edgeone-cache.outputs.cache-hit }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build pure static documentation
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          npm run build:static-docs 2>&1 | tee static-docs-build.log
          finished="$(date +%s)"
          echo "- Static build: $((finished - started))s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify zero-function deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test -d .static-docs

          if find .static-docs -type d \( -name cloud-functions -o -name edge-functions \) -print -quit | grep -q .; then
            echo '::error::A Functions directory exists in the static deployment artifact.'
            find .static-docs -type d \( -name cloud-functions -o -name edge-functions \) -print
            exit 1
          fi

          if find .static-docs -type f \( -path '*/cloud-functions/*' -o -path '*/edge-functions/*' \) -print -quit | grep -q .; then
            echo '::error::A Functions file exists in the static deployment artifact.'
            exit 1
          fi

          package_bytes="$(du -sb .static-docs | awk '{print $1}')"
          file_count="$(find .static-docs -type f | wc -l | tr -d ' ')"
          largest_file="$({ find .static-docs -type f -printf '%s %p\n' | sort -nr | head -n 1; } || true)"
          largest_bytes="${largest_file%% *}"

          {
            echo '- Cloud Functions: 0'
            echo '- Edge Functions: 0'
            echo "- Static files: ${file_count}"
            echo "- Static output: $((package_bytes / 1024 / 1024)) MiB"
            echo "- Largest file: ${largest_file}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if (( largest_bytes >= 25000000 )); then
            echo '::error::A static file is at or above the EdgeOne 25 MB single-file limit.'
            exit 1
          fi

      - name: Package pure static deployment
        shell: bash
        run: |
          set -euo pipefail
          zip_path="${RUNNER_TEMP}/fumadocs-static-production.zip"
          rm -f -- "${zip_path}"
          started="$(date +%s)"
          (cd .static-docs && zip -qr -9 "${zip_path}" .)
          finished="$(date +%s)"
          zip_bytes="$(stat -c '%s' "${zip_path}")"
          echo "STATIC_DEPLOY_ZIP=${zip_path}" >> "${GITHUB_ENV}"
          echo "- Deployment ZIP: $((zip_bytes / 1024 / 1024)) MiB; packaging $((finished - started))s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy prebuilt static site to EdgeOne
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          max_attempts=3
          attempt=1

          while :; do
            : > edgeone-static-production.log
            echo "EdgeOne deployment attempt ${attempt}/${max_attempts}"

            if edgeone makers deploy "${STATIC_DEPLOY_ZIP}" \
              -n "${EDGEONE_DOCS_PROJECT_NAME}" \
              -t "${EDGEONE_API_TOKEN}" \
              -e production \
              --site global \
              --json \
              2>&1 | tee edgeone-static-production.log; then
              break
            fi

            if ! grep -Eqi 'timeout|timed out|ETIMEDOUT|ECONNRESET|EAI_AGAIN|ENOTFOUND|socket hang up|check and set region failed|HTTP[^0-9]*5[0-9]{2}|status[^0-9]*5[0-9]{2}' edgeone-static-production.log; then
              echo '::error::EdgeOne deployment failed with a non-transient error; skipping retries.'
              exit 1
            fi

            if (( attempt >= max_attempts )); then
              echo "::error::EdgeOne deployment still failed after ${max_attempts} attempts."
              exit 1
            fi

            retry_delay=$((attempt * 3))
            echo "::warning::Transient EdgeOne deployment error detected; retrying in ${retry_delay}s."
            sleep "${retry_delay}"
            attempt=$((attempt + 1))
          done

          finished="$(date +%s)"
          echo "- EdgeOne deploy: $((finished - started))s; attempts ${attempt}/${max_attempts}" >> "${GITHUB_STEP_SUMMARY}"

          deployment_json="$(grep -Eo '\{"status":"success".*' edgeone-static-production.log | tail -n 1)"
          deployment_url="$(printf '%s' "${deployment_json}" | jq -r '.url // empty')"
          console_url="$(printf '%s' "${deployment_json}" | jq -r '.consoleUrl // empty')"
          [[ -n "${deployment_url}" ]] || { echo '::error::No deployment URL captured.'; exit 1; }
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "console_url=${console_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify production static routes
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$(mktemp -d)"
          trap 'rm -rf -- "${probe_dir}"' EXIT
          started="$(date +%s)"
          pids=()

          start_probe() {
            local name="$1"
            local path="$2"
            (
              curl --silent --show-error --max-time 60 -L -o /dev/null -w '%{http_code}' \
                "https://fumadocs.any1.tech${path}" > "${probe_dir}/${name}.status"
            ) &
            pids+=("$!")
          }

          start_probe home '/'
          start_probe docs '/docs/'
          start_probe math '/docs/math/advanced-mathematics/01-limits-continuity/'
          start_probe markdown '/docs/math/advanced-mathematics/01-limits-continuity.md'
          start_probe retired_upload '/api/blob/upload-url'
          start_probe retired_ingest '/api/integrations/anyworkflow'
          start_probe retired_download '/download/tasks/probe/1/probe/md'

          for pid in "${pids[@]}"; do
            wait "${pid}"
          done

          home="$(cat "${probe_dir}/home.status")"
          docs="$(cat "${probe_dir}/docs.status")"
          math="$(cat "${probe_dir}/math.status")"
          markdown="$(cat "${probe_dir}/markdown.status")"
          retired_upload="$(cat "${probe_dir}/retired_upload.status")"
          retired_ingest="$(cat "${probe_dir}/retired_ingest.status")"
          retired_download="$(cat "${probe_dir}/retired_download.status")"

          printf 'home=%s\ndocs=%s\nmath=%s\nmarkdown=%s\nretired_upload=%s\nretired_ingest=%s\nretired_download=%s\n' \
            "${home}" "${docs}" "${math}" "${markdown}" "${retired_upload}" "${retired_ingest}" "${retired_download}"

          [[ "${home}" == '200' ]]
          [[ "${docs}" == '200' ]]
          [[ "${math}" == '200' ]]
          [[ "${markdown}" == '200' ]]
          [[ "${retired_upload}" == '404' ]]
          [[ "${retired_ingest}" == '404' ]]
          [[ "${retired_download}" == '404' ]]

          finished="$(date +%s)"
          echo "- Parallel route verification: $((finished - started))s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify CDN compression and cache
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$(mktemp -d)"
          trap 'rm -rf -- "${probe_dir}"' EXIT
          headers_file="${probe_dir}/headers.txt"
          probe_url='https://fumadocs.any1.tech/docs/408'
          max_attempts=6

          header_value() {
            local key="$1"
            awk -F': *' -v key="${key}" '
              tolower($1) == tolower(key) {
                sub(/\r$/, "", $2)
                value = $2
              }
              END { print value }
            ' "${headers_file}"
          }

          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            : > "${headers_file}"
            curl --http1.1 --compressed --silent --show-error --max-time 60 \
              -H 'Accept-Encoding: br, gzip' \
              -D "${headers_file}" \
              -o /dev/null \
              "${probe_url}"

            content_encoding="$(header_value 'Content-Encoding')"
            cache_control="$(header_value 'Cache-Control')"
            edge_cache_status="$(header_value 'EO-Cache-Status')"
            echo "attempt=${attempt}/${max_attempts} content_encoding=${content_encoding:-none} cache_control=${cache_control:-none} edge_cache_status=${edge_cache_status:-none}"

            if [[ "${cache_control}" == *private* || "${cache_control}" == *no-store* ]]; then
              echo "::error::Unsafe CDN cache policy: ${cache_control}"
              exit 1
            fi

            if [[ "${content_encoding}" == 'br' || "${content_encoding}" == 'gzip' ]]; then
              echo "- CDN verification: ${content_encoding}; ${edge_cache_status:-unknown}; attempt ${attempt}/${max_attempts}" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            if (( attempt < max_attempts )); then
              echo "::warning::CDN compression is not ready (${edge_cache_status:-unknown}); retrying in 2s."
              sleep 2
            fi
          done

          echo "::error::CDN compression was still unavailable after ${max_attempts} attempts."
          exit 1

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## EdgeOne Fumadocs pure-static deployment'
            echo
            echo "- Project: ${EDGEONE_DOCS_PROJECT_NAME}"
            echo '- Runtime: static CDN only; Cloud Functions 0; Edge Functions 0'
            echo "- Job status: ${{ job.status }}"
            echo "- Commit: ${GITHUB_SHA}"
            if [ -n "${{ steps.deploy.outputs.console_url }}" ]; then
              echo "- Console: ${{ steps.deploy.outputs.console_url }}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
