name: Sync Algolia documentation index

on:
  push:
    branches:
      - main
    paths:
      - 'content/docs/**'
      - 'scripts/algolia-index.mjs'
      - 'scripts/sync-algolia.mjs'
      - 'scripts/static-docs-markdown.mjs'
      - 'source.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sync-algolia.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: algolia-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync documentation records
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate Algolia configuration
        id: config
        shell: bash
        env:
          ALGOLIA_APP_ID: ${{ vars.NEXT_PUBLIC_ALGOLIA_APP_ID }}
          ALGOLIA_INDEX_NAME: ${{ vars.NEXT_PUBLIC_ALGOLIA_INDEX_NAME }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
        run: |
          set -euo pipefail

          # Keep the workflow harmless before the repository values are added.
          if [[ -z "${ALGOLIA_APP_ID:-}" && -z "${ALGOLIA_INDEX_NAME:-}" && -z "${ALGOLIA_ADMIN_API_KEY:-}" ]]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Algolia configuration is not present; skipping index sync."
            exit 0
          fi

          missing=0
          for name in ALGOLIA_APP_ID ALGOLIA_INDEX_NAME ALGOLIA_ADMIN_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions value for Algolia: ${name}"
              missing=1
            fi
          done

          if (( missing )); then
            exit 1
          fi

          echo "configured=true" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sync Algolia index
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          ALGOLIA_APP_ID: ${{ vars.NEXT_PUBLIC_ALGOLIA_APP_ID }}
          ALGOLIA_INDEX_NAME: ${{ vars.NEXT_PUBLIC_ALGOLIA_INDEX_NAME }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
        run: npm run algolia:sync

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Algolia documentation index"
            echo
            echo "- Job status: `${{ job.status }}`"
            if [[ "${{ steps.config.outputs.configured }}" == "true" ]]; then
              echo "- Sync: attempted"
            else
              echo "- Sync: skipped until Algolia Actions values are configured"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
