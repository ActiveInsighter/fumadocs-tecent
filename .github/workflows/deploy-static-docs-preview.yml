name: Deploy static docs preview
# Preview deployment for the pure static CDN docs experiment.

on:
  push:
    branches:
      - codex/static-docs-cdn
      - codex/static-build-performance
    paths:
      - 'content/docs/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/build-static-docs.mjs'
      - 'scripts/static-docs-config.mjs'
      - 'scripts/static-docs-markdown.mjs'
      - 'scripts/static-root-layout.tsx'
      - 'next.config.static.mjs'
      - 'source.config.ts'
      - 'tests/static-docs-build.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-static-docs-preview.yml'
  workflow_dispatch:

concurrency:
  group: static-docs-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EDGEONE_CLI_VERSION: 1.6.31-3
  EDGEONE_STATIC_DOCS_PROJECT_NAME: fumadocs-static-docs-preview

jobs:
  deploy:
    name: Deploy pure static docs package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore project dependency tree
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}

      - name: Restore npm download cache on dependency miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json') }}

      - name: Install project dependencies on cache miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          install_started="$(date +%s)"
          npm ci --no-audit --no-fund
          install_finished="$(date +%s)"
          echo "- Dependency install: $((install_finished - install_started))s (cache miss)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Refresh Fumadocs generated source
        shell: bash
        run: |
          set -euo pipefail
          npm run postinstall
          echo "- node_modules cache hit: ${{ steps.node-modules-cache.outputs.cache-hit }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Restore Next/Turbopack build cache
        uses: actions/cache@v5
        with:
          path: .static-docs-stage/.next/cache
          key: ${{ runner.os }}-static-docs-turbopack-v2-${{ hashFiles('package-lock.json', 'next.config.static.mjs', 'source.config.ts', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-static-docs-turbopack-v2-${{ hashFiles('package-lock.json', 'next.config.static.mjs', 'source.config.ts', 'tsconfig.json') }}-
            ${{ runner.os }}-static-docs-turbopack-v2-

      - name: Restore EdgeOne CLI
        id: edgeone-cache
        uses: actions/cache@v5
        with:
          path: .edgeone-cli
          key: ${{ runner.os }}-node22-edgeone-cli-v1-${{ env.EDGEONE_CLI_VERSION }}

      - name: Install EdgeOne CLI on cache miss
        if: steps.edgeone-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          install_started="$(date +%s)"
          npm install --global --prefix "${GITHUB_WORKSPACE}/.edgeone-cli" \
            "edgeone@${EDGEONE_CLI_VERSION}" --no-audit --no-fund
          install_finished="$(date +%s)"
          echo "- EdgeOne CLI install: $((install_finished - install_started))s (cache miss)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          echo "${GITHUB_WORKSPACE}/.edgeone-cli/bin" >> "${GITHUB_PATH}"
          [[ -x "${GITHUB_WORKSPACE}/.edgeone-cli/bin/edgeone" ]] || {
            echo '::error::EdgeOne CLI executable is missing.'
            exit 1
          }
          [[ -n "${EDGEONE_API_TOKEN:-}" ]] || {
            echo '::error::Missing GitHub Actions secret: EDGEONE_API_TOKEN'
            exit 1
          }
          echo "- EdgeOne CLI cache hit: ${{ steps.edgeone-cache.outputs.cache-hit }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build the pure static documentation package
        shell: bash
        run: |
          set -euo pipefail
          build_started="$(date +%s)"
          npm run build:static-docs 2>&1 | tee static-docs-build.log
          build_finished="$(date +%s)"
          build_seconds="$((build_finished - build_started))"
          echo "static_build_seconds=${build_seconds}"
          echo "- Static package build: ${build_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Check static package footprint
        shell: bash
        run: |
          set -euo pipefail
          package_bytes="$(du -sb .static-docs | awk '{print $1}')"
          file_count="$(find .static-docs -type f | wc -l)"
          largest="$(
            find .static-docs -type f -printf '%s %p\n' \
              | awk '{ size = $1; $1 = ""; sub(/^ /, ""); if (size > max) { max = size; path = $0 } } END { print max, path }'
          )"
          largest_file_size="${largest%% *}"
          largest_file_path="${largest#* }"

          {
            echo "- Package size: $((package_bytes / 1024 / 1024)) MiB"
            echo "- File count: ${file_count}"
            echo "- Largest file: ${largest_file_path} ($((largest_file_size / 1024 / 1024)) MiB)"
          } >> "${GITHUB_STEP_SUMMARY}"

          if (( largest_file_size >= 25000000 )); then
            echo '::error::A static file is at or above the EdgeOne 25 MB single-file limit.'
            exit 1
          fi

      - name: Deploy the static documentation package
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_zip="${RUNNER_TEMP}/static-docs-deploy.zip"
          rm -f "${deploy_zip}"

          package_started="$(date +%s)"
          (
            cd .static-docs
            zip -q -r -6 "${deploy_zip}" .
          )
          package_finished="$(date +%s)"
          zip_bytes="$(stat -c '%s' "${deploy_zip}")"
          echo "- ZIP packaging: $((package_finished - package_started))s ($((zip_bytes / 1024 / 1024)) MiB)" >> "${GITHUB_STEP_SUMMARY}"

          deploy_started="$(date +%s)"
          edgeone makers deploy "${deploy_zip}" \
            -n "${EDGEONE_STATIC_DOCS_PROJECT_NAME}" \
            -t "${EDGEONE_API_TOKEN}" \
            -e production \
            --json \
            | tee static-docs-deploy.log
          deploy_finished="$(date +%s)"
          echo "- EdgeOne deploy: $((deploy_finished - deploy_started))s" >> "${GITHUB_STEP_SUMMARY}"

          deployment_url="$(
            grep -Eo '\{"status":"success".*' static-docs-deploy.log \
              | tail -n 1 \
              | jq -r '.url // empty'
          )"
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify deployed routes from the runner
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="${{ steps.deploy.outputs.deployment_url }}"
          [[ -n "${deployment_url}" ]] || { echo '::error::No deployment URL captured.'; exit 1; }

          cookie_jar="$(mktemp)"
          warmup_status="$(
            curl --silent --show-error --max-time 60 \
              -L -c "${cookie_jar}" -b "${cookie_jar}" \
              -o /dev/null -w '%{http_code}' \
              "${deployment_url}"
          )"
          echo "warmup_status=${warmup_status}"
          [[ "${warmup_status}" == "200" ]]

          export base_url="${deployment_url%%\?*}"
          export cookie_jar
          printf '%s\n' \
            '/' \
            '/docs/' \
            '/docs/math/advanced-mathematics/01-limits-continuity/' \
            '/docs/math/advanced-mathematics/01-limits-continuity.md' \
            | xargs -P 4 -I '{}' bash -c '
                status="$(curl --silent --show-error --max-time 60 -L -b "${cookie_jar}" -o /dev/null -w "%{http_code}" "${base_url}$1")"
                echo "route $1 -> ${status}"
                [[ "${status}" == "200" ]]
              ' _ '{}'

      - name: Diagnose EdgeOne deployment status
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          api_tmp="$(mktemp -d)"
          response_file="${api_tmp}/describe.json"
          jq -cn \
            --arg project_id "makers-vhp1u9ywp8a4" \
            '{
              Action: "DescribePagesDeployments",
              ProjectId: $project_id,
              Offset: 0,
              Limit: 5,
              OrderBy: "CreatedOn",
              Order: "Desc"
            }' \
            | curl --http1.1 --silent --show-error --max-time 30 \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
                --data-binary @- \
                --output "${response_file}" \
                "${EDGEONE_PAGES_API_URL:-https://pages-api.cloud.tencent.com/v1}"
          jq '{
            code: .Code,
            message: .Message,
            deployments: ((.Data.Response.Deployments // []) | map({
              deploymentId: .DeploymentId,
              status: .Status,
              environment: .Env,
              usedInProd: .UsedInProd,
              createdOn: .CreatedOn,
              updatedOn: .UpdatedOn,
              error: (.Error // .ErrorMessage // .FailReason // .Reason // null)
            }))
          }' "${response_file}"

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Static docs preview deployment"
            echo
            echo "- Project: \`${EDGEONE_STATIC_DOCS_PROJECT_NAME}\` (isolated from production)"
            echo "- Environment: \`production\` of the isolated experiment project"
            echo "- Job status: \`${{ job.status }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            if [ -n "${{ steps.deploy.outputs.deployment_url }}" ]; then
              echo "- Preview URL: ${{ steps.deploy.outputs.deployment_url }}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
