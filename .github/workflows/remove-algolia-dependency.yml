name: Remove direct Algolia dependency

on:
  push:
    branches:
      - codex/zbsearch-static
    paths:
      - '.github/workflows/remove-algolia-dependency.yml'

permissions:
  contents: write

concurrency:
  group: zbsearch-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/zbsearch-static

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Remove direct Algolia dependency and regenerate lock
        shell: bash
        run: |
          set -euo pipefail
          npm pkg delete dependencies.algoliasearch
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json'); if (p.dependencies?.algoliasearch) process.exit(1)"
          echo 'Algolia is no longer a direct project dependency.'
          echo 'Any remaining lockfile entry is transitive/peer metadata owned by Fumadocs:'
          npm explain algoliasearch || true

      - name: Commit regenerated manifests
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No manifest changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: remove direct Algolia dependency'
          git push origin HEAD:codex/zbsearch-static
