name: Deploy EdgeOne Blob functions

on:
  push:
    branches:
      - main
    paths:
      - 'edgeone/**'
      - '.github/workflows/deploy-edgeone-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EDGEONE_CLI_VERSION: 1.6.19
  EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}

jobs:
  deploy:
    name: Upload EdgeOne functions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install EdgeOne CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "edgeone@${EDGEONE_CLI_VERSION}" --no-audit --no-fund
          edgeone --version

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${EDGEONE_PROJECT_NAME:-}" ]] || {
            echo "::error::Missing GitHub Actions variable: EDGEONE_PROJECT_NAME"
            exit 1
          }
          [[ -n "${EDGEONE_API_TOKEN:-}" ]] || {
            echo "::error::Missing GitHub Actions secret: EDGEONE_API_TOKEN"
            exit 1
          }

      - name: Configure Blob function secrets
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_INTERNAL_API_KEY: ${{ secrets.EDGEONE_INTERNAL_API_KEY }}
          EDGEONE_DOWNLOAD_GATEWAY_SECRET: ${{ secrets.EDGEONE_DOWNLOAD_GATEWAY_SECRET }}
          EDGEONE_PAGES_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
        run: |
          set -euo pipefail

          set_env() {
            edgeone makers env set \
              -t "${EDGEONE_API_TOKEN}" \
              "$1" \
              "$2" \
              2>&1 | sed -E 's/(eo_token=)[^&[:space:]]+/\1REDACTED/g; s/(sb_(publishable|secret)_[A-Za-z0-9_-]+|sk-[A-Za-z0-9_-]+)/REDACTED/g'
          }

          set_env INTERNAL_API_KEY "${EDGEONE_INTERNAL_API_KEY}"
          set_env DOWNLOAD_GATEWAY_SECRET "${EDGEONE_DOWNLOAD_GATEWAY_SECRET}"

      - name: Deploy the Blob functions package
        shell: bash
        run: |
          set -euo pipefail
          edgeone makers deploy ./edgeone \
            -n "${EDGEONE_PROJECT_NAME}" \
            -t "${EDGEONE_API_TOKEN}" \
            -e production \
            2>&1 | sed -E 's/(eo_token=)[^&[:space:]]+/\1REDACTED/g'
