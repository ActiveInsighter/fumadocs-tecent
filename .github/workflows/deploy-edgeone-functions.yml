name: Deploy EdgeOne Blob functions

on:
  push:
    branches:
      - main
    paths:
      - 'edgeone/**'
      - '.github/workflows/deploy-edgeone-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EDGEONE_CLI_VERSION: 1.6.19
  EDGEONE_PAGES_API_URL: https://pages-api.cloud.tencent.com/v1
  EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
  EDGEONE_BLOB_CUSTOM_DOMAIN: fumadocs-upload.any1.tech

jobs:
  deploy:
    name: Upload EdgeOne functions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install EdgeOne CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "edgeone@${EDGEONE_CLI_VERSION}" --no-audit --no-fund
          edgeone --version

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${EDGEONE_PROJECT_NAME:-}" ]] || {
            echo "::error::Missing GitHub Actions variable: EDGEONE_PROJECT_NAME"
            exit 1
          }
          [[ -n "${EDGEONE_API_TOKEN:-}" ]] || {
            echo "::error::Missing GitHub Actions secret: EDGEONE_API_TOKEN"
            exit 1
          }

      - name: Configure Blob function secrets
        id: configure
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_INTERNAL_API_KEY: ${{ secrets.EDGEONE_INTERNAL_API_KEY }}
          EDGEONE_DOWNLOAD_GATEWAY_SECRET: ${{ secrets.EDGEONE_DOWNLOAD_GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          api_tmp="$(mktemp -d)"
          trap 'rm -rf -- "${api_tmp}"' EXIT
          project_response="${api_tmp}/describe-pages-projects.json"
          project_request="${api_tmp}/describe-pages-projects.request.json"

          jq -cn \
            --arg project_name "${EDGEONE_PROJECT_NAME}" \
            '{
              Action: "DescribePagesProjects",
              ProjectIds: [],
              Filters: [{Name: "Name", Values: [$project_name]}]
            }' > "${project_request}"

          curl --silent --show-error --fail-with-body --max-time 30 \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
            --data-binary "@${project_request}" \
            --output "${project_response}" \
            "${EDGEONE_PAGES_API_URL}"

          project_id="$(
            jq -r --arg project_name "${EDGEONE_PROJECT_NAME}" '
              (.Data.Response // .Data // .)
              | (.Projects // [])[]
              | select(.Name == $project_name)
              | .ProjectId
            ' "${project_response}" | head -n 1
          )"
          if [ -z "${project_id}" ] || [ "${project_id}" = 'null' ]; then
            echo '::error::EdgeOne Blob project was not found.'
            exit 1
          fi
          echo "project_id=${project_id}" >> "${GITHUB_OUTPUT}"

          response_file="${api_tmp}/modify-pages-project-envs.json"
          jq -cn \
            --arg project_id "${project_id}" \
            --arg internal_key "${EDGEONE_INTERNAL_API_KEY}" \
            --arg gateway_secret "${EDGEONE_DOWNLOAD_GATEWAY_SECRET}" \
            '{
              Action: "ModifyPagesProjectEnvs",
              ProjectId: $project_id,
              EnvVars: [
                {Key: "INTERNAL_API_KEY", Value: $internal_key},
                {Key: "DOWNLOAD_GATEWAY_SECRET", Value: $gateway_secret}
              ]
            }' \
            | curl --silent --show-error --fail-with-body --max-time 30 \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
                --data-binary @- \
                --output "${response_file}" \
                "${EDGEONE_PAGES_API_URL}"

          if ! jq -e '((.Code // .Data.Response.Code // .Data.Code // 0) == 0) and ((.Error // .Data.Response.Error // .Data.Error) == null)' "${response_file}" >/dev/null; then
            echo '::error::EdgeOne Blob runtime variable update failed.'
            exit 1
          fi

          env_response="${api_tmp}/describe-pages-project-envs.json"
          jq -cn --arg project_id "${project_id}" \
            '{Action: "DescribePagesProjectEnvs", ProjectId: $project_id}' \
            | curl --silent --show-error --fail-with-body --max-time 30 \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
                --data-binary @- \
                --output "${env_response}" \
                "${EDGEONE_PAGES_API_URL}"

          missing=0
          for name in INTERNAL_API_KEY DOWNLOAD_GATEWAY_SECRET; do
            if jq -e --arg name "${name}" '
              (.Data.Response // .Data // .)
              | (.EnvVars // [])
              | any(.[]; .Key == $name and ((.Value // "") | length > 0))
            ' "${env_response}" >/dev/null; then
              echo "${name}=present"
            else
              echo "::error::Missing or empty EdgeOne Blob runtime variable: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Link Blob project for Pages storage runtime
        shell: bash
        run: |
          set -euo pipefail
          edgeone makers link \
            -n "${EDGEONE_PROJECT_NAME}" \
            -t "${EDGEONE_API_TOKEN}" \
            2>&1 | sed -E 's/(eo_token=)[^&[:space:]]+/\1REDACTED/g'

      - name: Verify EdgeOne Blob storage access
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_ID: ${{ steps.configure.outputs.project_id }}
        run: |
          set -euo pipefail

          api_tmp="$(mktemp -d)"
          trap 'rm -rf -- "${api_tmp}"' EXIT
          response_file="${api_tmp}/blob-sts.json"
          http_status="$({
            curl --silent --show-error --max-time 30 \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
              --data-binary "{\"ProjectId\":\"${EDGEONE_PROJECT_ID}\"}" \
              --output "${response_file}" \
              -w '%{http_code}' \
              https://blob-sts.edgeone.site/
          } || true)"

          echo "blob_sts_http_status=${http_status}"
          if [[ "${http_status}" != 2* ]] || ! jq -e '
            ((.data // .) | .tmpSecretId and .tmpSecretKey and .sessionToken and .expiredTime)
          ' "${response_file}" >/dev/null; then
            echo '::error::EdgeOne Blob storage credentials were not issued for this project.'
            exit 1
          fi
          echo 'EdgeOne Blob storage credentials=available'

      - name: Ensure Blob custom domain binding
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_ID: ${{ steps.configure.outputs.project_id }}
          EDGEONE_BLOB_CUSTOM_DOMAIN: ${{ env.EDGEONE_BLOB_CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const endpoint = process.env.EDGEONE_PAGES_API_URL;
          const projectId = process.env.EDGEONE_PROJECT_ID;
          const domain = process.env.EDGEONE_BLOB_CUSTOM_DOMAIN;

          const request = async (body) => {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${process.env.EDGEONE_API_TOKEN}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify(body),
            });
            const payload = await response.json();
            return { httpStatus: response.status, payload };
          };

          const list = await request({
            Action: 'DescribePagesZoneCustomDomains',
            ProjectId: projectId,
          });
          if (list.httpStatus < 200 || list.httpStatus >= 300) {
            throw new Error(`EdgeOne custom-domain query returned HTTP ${list.httpStatus}`);
          }
          const listResponse = list.payload?.Data?.Response ?? list.payload;
          const current = (listResponse?.PagesDomains ?? []).find(
            (item) => item?.Type === 'Custom' && item?.Domain === domain,
          );

          let binding = current;
          if (!binding) {
            const created = await request({
              Action: 'CreatePagesZoneCustomDomain',
              ProjectId: projectId,
              Domain: domain,
            });
            const code = created.payload?.Code ?? created.payload?.Data?.Response?.Code;
            if (
              created.httpStatus < 200
              || created.httpStatus >= 300
              || (code !== undefined && code !== 0)
            ) {
              throw new Error('Failed to attach the Blob custom domain to EdgeOne.');
            }
            const refreshed = await request({
              Action: 'DescribePagesZoneCustomDomains',
              ProjectId: projectId,
            });
            const refreshedResponse = refreshed.payload?.Data?.Response ?? refreshed.payload;
            binding = (refreshedResponse?.PagesDomains ?? []).find(
              (item) => item?.Type === 'Custom' && item?.Domain === domain,
            ) ?? created.payload?.Data?.Response ?? created.payload;
          }

          console.log(JSON.stringify({
            Domain: binding?.Domain ?? domain,
            Status: binding?.Status ?? 'unknown',
            Cname: binding?.Cname ?? null,
            CurrentCname: binding?.CurrentCname ?? null,
          }, null, 2));
          NODE

      - name: Deploy the Blob functions package
        shell: bash
        run: |
          set -euo pipefail
          edgeone makers deploy ./edgeone \
            -n "${EDGEONE_PROJECT_NAME}" \
            -t "${EDGEONE_API_TOKEN}" \
            -e production \
            2>&1 | sed -E 's/(eo_token=)[^&[:space:]]+/\1REDACTED/g'

      - name: Verify public EdgeOne Blob routes
        shell: bash
        env:
          EDGEONE_INTERNAL_API_KEY: ${{ secrets.EDGEONE_INTERNAL_API_KEY }}
          EDGEONE_DOWNLOAD_GATEWAY_SECRET: ${{ secrets.EDGEONE_DOWNLOAD_GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          api_tmp="$(mktemp -d)"
          trap 'rm -rf -- "${api_tmp}"' EXIT

          signer_response="${api_tmp}/signer.json"
          signer_status="$({
            curl --silent --show-error --max-time 30 \
              --request POST \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -H "X-Internal-Key: ${EDGEONE_INTERNAL_API_KEY}" \
              --data-binary '{"documentId":"edgeone-verification-probe","version":1,"format":"md"}' \
              --output "${signer_response}" \
              -w '%{http_code}' \
              https://fumadocs-upload.any1.tech/api/blob/upload-url
          } || true)"
          gateway_status="$({
            curl --silent --show-error --max-time 30 \
              --request GET \
              -H "X-Internal-Key: ${EDGEONE_DOWNLOAD_GATEWAY_SECRET}" \
              --output /dev/null \
              -w '%{http_code}' \
              https://fumadocs-upload.any1.tech/download/edgeone-verification-probe/1/md
          } || true)"

          echo "signer_with_key=${signer_status}"
          echo "gateway_missing_artifact=${gateway_status}"
          [[ "${signer_status}" == '200' ]]
          [[ "${gateway_status}" == '404' ]]
