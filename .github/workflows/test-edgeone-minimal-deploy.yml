name: Benchmark minimal EdgeOne deploy overhead

on:
  push:
    branches:
      - codex/edgeone-minimal-deploy-poc

permissions:
  contents: read

env:
  EDGEONE_CLI_VERSION: 1.6.31-3
  EDGEONE_DOCS_PROJECT_NAME: ${{ vars.EDGEONE_DOCS_PROJECT_NAME }}

jobs:
  benchmark:
    name: Tiny static vs tiny Edge Function
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore EdgeOne CLI
        id: edgeone-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/edgeone-cli
          key: ${{ runner.os }}-node22-edgeone-cli-v1-${{ env.EDGEONE_CLI_VERSION }}

      - name: Install EdgeOne CLI on cache miss
        if: steps.edgeone-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "${HOME}/.local/edgeone-cli" \
            "edgeone@${EDGEONE_CLI_VERSION}" --no-audit --no-fund

      - name: Configure EdgeOne CLI
        shell: bash
        run: |
          set -euo pipefail
          echo "${HOME}/.local/edgeone-cli/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/edgeone-cli/bin:${PATH}"
          edgeone --version

      - name: Create tiny static deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tiny-site"
          cat > "${RUNNER_TEMP}/tiny-site/index.html" <<'EOF'
          <!doctype html><meta charset="utf-8"><title>EdgeOne benchmark</title><p>ok</p>
          EOF
          cat > "${RUNNER_TEMP}/tiny-site/package.json" <<'EOF'
          {"name":"edgeone-deploy-benchmark","private":true}
          EOF
          (cd "${RUNNER_TEMP}/tiny-site" && zip -qr -9 "${RUNNER_TEMP}/tiny-static.zip" .)
          echo "TINY_STATIC_ZIP=${RUNNER_TEMP}/tiny-static.zip" >> "${GITHUB_ENV}"
          echo "tiny_static_zip_bytes=$(stat -c '%s' "${RUNNER_TEMP}/tiny-static.zip")" >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy tiny static ZIP to preview
        shell: bash
        run: |
          set -euo pipefail
          raw_log="${RUNNER_TEMP}/tiny-static.raw.log"
          started="$(date +%s)"
          echo "TINY_STATIC_BEGIN=$(date -Ins)"
          edgeone makers deploy "${TINY_STATIC_ZIP}" \
            -n "${EDGEONE_DOCS_PROJECT_NAME}" \
            -t "${EDGEONE_API_TOKEN}" \
            -e preview \
            --site global \
            2>&1 \
            | tee "${raw_log}" \
            | sed -u -E 's/(eo_token=)[^&[:space:]]+/\1REDACTED/g'
          finished="$(date +%s)"
          echo "TINY_STATIC_END=$(date -Ins)"
          echo "tiny_static_deploy_seconds=$((finished - started))" | tee -a "${GITHUB_STEP_SUMMARY}"

          full_url="$(grep -Eo 'Deploy URL: https://[^[:space:]]+' "${raw_log}" | tail -n 1 | sed -E 's/^Deploy URL: //; s/[),.;]+$//')"
          test -n "${full_url}"
          url_file="${RUNNER_TEMP}/tiny-static-url.txt"
          PREVIEW_URL="${full_url}" node <<'NODE' > "${url_file}"
          const u = new URL(process.env.PREVIEW_URL);
          u.pathname = '/';
          process.stdout.write(u.toString());
          NODE
          status="$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' "$(cat "${url_file}")")"
          echo "tiny_static_status=${status}"
          [[ "${status}" == "200" ]]
          rm -f -- "${raw_log}" "${url_file}"

      - name: Add official Edge Function hello example
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tiny-site/edge-functions/api"
          cat > "${RUNNER_TEMP}/tiny-site/edge-functions/api/hello.js" <<'EOF'
          export default function onRequest(context) {
            return new Response('Hello from Edge Functions!');
          }
          EOF
          (cd "${RUNNER_TEMP}/tiny-site" && zip -qr -9 "${RUNNER_TEMP}/tiny-edge.zip" .)
          echo "TINY_EDGE_ZIP=${RUNNER_TEMP}/tiny-edge.zip" >> "${GITHUB_ENV}"
          echo "tiny_edge_zip_bytes=$(stat -c '%s' "${RUNNER_TEMP}/tiny-edge.zip")" >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy tiny Edge Function ZIP to preview
        shell: bash
        run: |
          set -euo pipefail
          raw_log="${RUNNER_TEMP}/tiny-edge.raw.log"
          started="$(date +%s)"
          echo "TINY_EDGE_BEGIN=$(date -Ins)"
          edgeone makers deploy "${TINY_EDGE_ZIP}" \
            -n "${EDGEONE_DOCS_PROJECT_NAME}" \
            -t "${EDGEONE_API_TOKEN}" \
            -e preview \
            --site global \
            2>&1 \
            | tee "${raw_log}" \
            | sed -u -E 's/(eo_token=)[^&[:space:]]+/\1REDACTED/g'
          finished="$(date +%s)"
          echo "TINY_EDGE_END=$(date -Ins)"
          echo "tiny_edge_deploy_seconds=$((finished - started))" | tee -a "${GITHUB_STEP_SUMMARY}"

          full_url="$(grep -Eo 'Deploy URL: https://[^[:space:]]+' "${raw_log}" | tail -n 1 | sed -E 's/^Deploy URL: //; s/[),.;]+$//')"
          test -n "${full_url}"
          url_file="${RUNNER_TEMP}/tiny-edge-url.txt"
          PREVIEW_URL="${full_url}" node <<'NODE' > "${url_file}"
          const u = new URL(process.env.PREVIEW_URL);
          u.pathname = '/api/hello';
          process.stdout.write(u.toString());
          NODE
          body_file="${RUNNER_TEMP}/tiny-edge-body.txt"
          status="$(curl --silent --show-error --max-time 30 -o "${body_file}" -w '%{http_code}' "$(cat "${url_file}")")"
          echo "tiny_edge_status=${status}"
          [[ "${status}" == "200" ]]
          grep -Fx 'Hello from Edge Functions!' "${body_file}"
          rm -f -- "${raw_log}" "${url_file}" "${body_file}"
