name: Inspect EdgeOne project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect project metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

    steps:
      - name: Query project metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const endpoint = 'https://pages-api.cloud.tencent.com/v1';
          const request = async (body) => {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${process.env.EDGEONE_API_TOKEN}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify(body),
            });
            const payload = await response.json();
            return { httpStatus: response.status, payload };
          };

          const projectsResult = await request({
            Action: 'DescribePagesProjects',
            Offset: 0,
            Limit: 100,
          });
          if (projectsResult.httpStatus < 200 || projectsResult.httpStatus >= 300) {
            throw new Error(`EdgeOne API returned HTTP ${projectsResult.httpStatus}`);
          }
          const projects = projectsResult.payload?.Data?.Response?.Projects ?? [];
          console.log(JSON.stringify(projects.map((project) => ({
            Name: project.Name,
            ProjectId: project.ProjectId,
            PresetDomain: project.PresetDomain,
            IsTld: project.IsTld,
            CustomDomains: project.CustomDomains,
          })), null, 2));

          const domain = 'fumadocs.any1.tech';
          const oldProjectId = 'makers-e032dznehcv2';
          const newProjectId = 'makers-nycxgnmbk5ft';
          const domainResults = new Map();

          for (const projectId of [oldProjectId, newProjectId]) {
            const result = await request({
              Action: 'DescribePagesZoneCustomDomains',
              ProjectId: projectId,
            });
            const response = result.payload?.Data?.Response ?? result.payload;
            console.log(JSON.stringify({
              action: 'DescribePagesZoneCustomDomains',
              projectId,
              httpStatus: result.httpStatus,
              code: result.payload?.Code,
              message: result.payload?.Message,
              response: {
                PagesDomains: response?.PagesDomains,
              },
            }, null, 2));
            domainResults.set(projectId, response?.PagesDomains ?? []);
          }

          const oldHasDomain = domainResults.get(oldProjectId).some((item) => item?.Domain === domain && item?.Type === 'Custom');
          const newHasDomain = domainResults.get(newProjectId).some((item) => item?.Domain === domain && item?.Type === 'Custom');
          if (oldHasDomain && newHasDomain) {
            throw new Error('The custom domain is attached to both EdgeOne projects.');
          }

          if (!newHasDomain) {
            if (oldHasDomain) {
              const deleted = await request({
                Action: 'DeletePagesProjectCustomDomains',
                ProjectId: oldProjectId,
                CustomDomains: [domain],
              });
              console.log(JSON.stringify({
                action: 'DeletePagesProjectCustomDomains',
                projectId: oldProjectId,
                domain,
                httpStatus: deleted.httpStatus,
                code: deleted.payload?.Code,
                message: deleted.payload?.Message,
              }, null, 2));
              if (deleted.httpStatus < 200 || deleted.httpStatus >= 300 || deleted.payload?.Code !== 0) {
                throw new Error('Failed to detach the custom domain from the old project.');
              }
            }

            const created = await request({
              Action: 'CreatePagesZoneCustomDomain',
              ProjectId: newProjectId,
              Domain: domain,
            });
            const createdResponse = created.payload?.Data?.Response ?? created.payload;
            console.log(JSON.stringify({
              action: 'CreatePagesZoneCustomDomain',
              projectId: newProjectId,
              httpStatus: created.httpStatus,
              code: created.payload?.Code,
              message: created.payload?.Message,
              domain: createdResponse?.Domain,
              status: createdResponse?.Status,
              cname: createdResponse?.Cname,
              currentCname: createdResponse?.CurrentCname,
            }, null, 2));
            if (created.httpStatus < 200 || created.httpStatus >= 300 || created.payload?.Code !== 0) {
              throw new Error('Failed to attach the custom domain to the new project.');
            }
          } else {
            console.log(JSON.stringify({
              action: 'CreatePagesZoneCustomDomain',
              projectId: newProjectId,
              domain,
              result: 'already-attached',
            }, null, 2));
          }
          NODE
