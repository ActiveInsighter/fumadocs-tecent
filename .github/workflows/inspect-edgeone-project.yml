name: Inspect EdgeOne project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect project metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

    steps:
      - name: Query project metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const response = await fetch('https://pages-api.cloud.tencent.com/v1', {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.EDGEONE_API_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              Action: 'DescribePagesProjects',
              Filters: [{ Name: 'ProjectId', Values: ['makers-nycxgnmbk5ft'] }],
              Offset: 0,
              Limit: 10,
            }),
          });
          if (!response.ok) throw new Error(`EdgeOne API returned HTTP ${response.status}`);
          const payload = await response.json();
          const projects = payload?.Data?.Response?.Projects ?? [];
          console.log(JSON.stringify(projects.map((project) => ({
            Name: project.Name,
            ProjectId: project.ProjectId,
            PresetDomain: project.PresetDomain,
            IsTld: project.IsTld,
            CustomDomains: project.CustomDomains,
          })), null, 2));
          NODE
