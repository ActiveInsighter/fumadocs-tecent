name: Install Twoslash dependencies

on:
  push:
    branches:
      - docs/official-writing
    paths:
      - .github/workflows/install-twoslash-lock.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: docs/official-writing

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Twoslash packages
        run: npm install --save-exact fumadocs-twoslash@3.3.0 twoslash@0.3.9 --no-audit --no-fund

      - name: Commit lockfile update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json

          if git diff --cached --quiet; then
            echo "Dependencies are already up to date."
            exit 0
          fi

          git commit -m "build: add Twoslash dependencies"
          git push origin HEAD:docs/official-writing
