name: Capture workflow run metadata
description: Save the current run ID and recent workflow runs as an artifact and issue.

inputs:
  github_token:
    description: GitHub token with actions:read and issues:write permission.
    required: true
  recent_count:
    description: Number of recent workflow runs to capture.
    required: false
    default: '10'

outputs:
  run_id:
    description: Current GitHub Actions run ID.
    value: ${{ steps.capture.outputs.run_id }}
  metadata_file:
    description: Path to the generated metadata JSON file.
    value: ${{ steps.capture.outputs.metadata_file }}

runs:
  using: composite
  steps:
    - id: capture
      name: Capture run metadata
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        RECENT_COUNT: ${{ inputs.recent_count }}
      run: |
        set -euo pipefail

        if ! [[ "${RECENT_COUNT}" =~ ^[0-9]+$ ]] || [ "${RECENT_COUNT}" -lt 1 ] || [ "${RECENT_COUNT}" -gt 100 ]; then
          echo "recent-count must be an integer between 1 and 100." >&2
          exit 1
        fi

        metadata_dir="${GITHUB_WORKSPACE}/.run-metadata"
        metadata_file="${metadata_dir}/workflow-runs.json"
        recent_file="${metadata_dir}/recent-runs.json"
        issue_body="${metadata_dir}/workflow-run-index.md"
        mkdir -p "${metadata_dir}"

        gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=${RECENT_COUNT}" \
          > "${recent_file}"

        jq \
          --arg captured_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          --arg repository "${GITHUB_REPOSITORY}" \
          --arg run_id "${GITHUB_RUN_ID}" \
          --arg run_number "${GITHUB_RUN_NUMBER}" \
          --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
          --arg workflow "${GITHUB_WORKFLOW}" \
          --arg ref "${GITHUB_REF}" \
          --arg sha "${GITHUB_SHA}" \
          '{
            captured_at: $captured_at,
            repository: $repository,
            current_run: {
              id: ($run_id | tonumber),
              number: ($run_number | tonumber),
              attempt: ($run_attempt | tonumber),
              workflow: $workflow,
              ref: $ref,
              sha: $sha
            },
            recent_runs: [
              .workflow_runs[] | {
                id,
                name,
                event,
                status,
                conclusion,
                run_number,
                run_attempt,
                head_branch,
                head_sha,
                html_url,
                created_at,
                updated_at
              }
            ]
          }' "${recent_file}" > "${metadata_file}"

        {
          echo "# Workflow run index"
          echo
          echo "Current run: [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          echo
          echo "| Workflow | Run ID | Event | Status | Branch | Commit | Updated |"
          echo "| --- | ---: | --- | --- | --- | --- | --- |"
          jq -r '.recent_runs[] | [
            (.name // "unknown" | gsub("\\|"; "\\|")),
            ("[" + (.id | tostring) + "](" + .html_url + ")"),
            (.event // "-"),
            ((if (.conclusion // "") == "" then .status else .conclusion end) // "unknown"),
            ((.head_branch // "-") | gsub("\\|"; "\\|")),
            ((.head_sha // "-")[0:12]),
            (.updated_at // .created_at // "-")
          ] | "| " + join(" | ") + " |"' "${metadata_file}"
        } > "${issue_body}"

        issue_number="$(
          gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --search '"Workflow run index" in:title' \
            --json number,title \
            --jq '.[] | select(.title == "Workflow run index") | .number' \
            | head -n 1
        )"

        if [ -n "${issue_number}" ]; then
          gh issue edit "${issue_number}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file "${issue_body}"
        else
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Workflow run index" \
            --body-file "${issue_body}"
        fi

        rm -f "${recent_file}"
        echo "run_id=${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"
        echo "metadata_file=${metadata_file}" >> "${GITHUB_OUTPUT}"

    - name: Upload run metadata
      uses: actions/upload-artifact@v7
      with:
        name: workflow-run-${{ steps.capture.outputs.run_id }}
        path: ${{ steps.capture.outputs.metadata_file }}
        if-no-files-found: error
        retention-days: 30
