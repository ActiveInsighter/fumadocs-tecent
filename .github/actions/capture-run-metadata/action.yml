name: Capture workflow run metadata
description: Persist the current run ID and recent workflow runs without blocking deployment.

inputs:
  github_token:
    description: GitHub token with actions:read permission and optional issues:write permission.
    required: true
  recent_count:
    description: Number of recent workflow runs to capture.
    required: false
    default: '10'
  phase:
    description: Logical capture phase used in artifacts and the run index.
    required: false
    default: start
  outcome:
    description: Current job outcome, such as in_progress, success, failure, or cancelled.
    required: false
    default: in_progress

outputs:
  run_id:
    description: Current GitHub Actions run ID.
    value: ${{ steps.capture.outputs.run_id }}
  run_url:
    description: URL of the current GitHub Actions run.
    value: ${{ steps.capture.outputs.run_url }}
  metadata_file:
    description: Path to the generated metadata JSON file.
    value: ${{ steps.capture.outputs.metadata_file }}
  phase:
    description: Sanitized capture phase.
    value: ${{ steps.capture.outputs.phase }}

runs:
  using: composite
  steps:
    - id: capture
      name: Capture run metadata
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        RECENT_COUNT: ${{ inputs.recent_count }}
        INPUT_PHASE: ${{ inputs.phase }}
        INPUT_OUTCOME: ${{ inputs.outcome }}
      run: |
        set -euo pipefail

        if ! [[ "${RECENT_COUNT}" =~ ^[0-9]+$ ]] || [ "${RECENT_COUNT}" -lt 1 ] || [ "${RECENT_COUNT}" -gt 100 ]; then
          echo "::warning title=Invalid recent run count::Using 10 instead of '${RECENT_COUNT}'."
          RECENT_COUNT=10
        fi

        phase="$(printf '%s' "${INPUT_PHASE:-start}" | sed -E 's/[^[:alnum:]_.-]+/-/g; s/^-+//; s/-+$//')"
        [ -n "${phase}" ] || phase="start"
        outcome="${INPUT_OUTCOME:-in_progress}"
        run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        metadata_dir="${GITHUB_WORKSPACE}/.run-metadata/${phase}"
        metadata_file="${metadata_dir}/workflow-runs.json"
        recent_file="${metadata_dir}/recent-runs.json"
        issue_body="${metadata_dir}/workflow-run-index.md"
        mkdir -p "${metadata_dir}"

        # Publish the immutable current Run ID before any network request. Even if
        # GitHub's API or issue persistence is unavailable, later steps and the
        # job summary still receive a valid ID and URL.
        {
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_url=${run_url}"
          echo "metadata_file=${metadata_file}"
          echo "phase=${phase}"
        } >> "${GITHUB_OUTPUT}"

        printf '{"workflow_runs":[]}\n' > "${recent_file}"
        if ! gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=${RECENT_COUNT}" \
          > "${recent_file}"; then
          echo "::warning title=Run history unavailable::The current Run ID was captured, but recent runs could not be queried."
          printf '{"workflow_runs":[]}\n' > "${recent_file}"
        fi

        jq \
          --arg captured_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          --arg repository "${GITHUB_REPOSITORY}" \
          --arg run_id "${GITHUB_RUN_ID}" \
          --arg run_number "${GITHUB_RUN_NUMBER}" \
          --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
          --arg workflow "${GITHUB_WORKFLOW}" \
          --arg ref "${GITHUB_REF}" \
          --arg sha "${GITHUB_SHA}" \
          --arg run_url "${run_url}" \
          --arg phase "${phase}" \
          --arg outcome "${outcome}" \
          '{
            captured_at: $captured_at,
            repository: $repository,
            current_run: {
              id: ($run_id | tonumber),
              number: ($run_number | tonumber),
              attempt: ($run_attempt | tonumber),
              workflow: $workflow,
              ref: $ref,
              sha: $sha,
              url: $run_url,
              phase: $phase,
              outcome: $outcome
            },
            recent_runs: [
              .workflow_runs[] | {
                id,
                name,
                event,
                status,
                conclusion,
                run_number,
                run_attempt,
                head_branch,
                head_sha,
                html_url,
                created_at,
                updated_at
              }
            ]
          }' "${recent_file}" > "${metadata_file}"

        {
          echo "# Workflow run index"
          echo
          echo "Current run: [\`${GITHUB_RUN_ID}\`](${run_url})"
          echo
          echo "- Phase: \`${phase}\`"
          echo "- Job outcome: \`${outcome}\`"
          echo "- Commit: \`${GITHUB_SHA}\`"
          echo
          echo "| Workflow | Run ID | Event | Status | Branch | Commit | Updated |"
          echo "| --- | ---: | --- | --- | --- | --- | --- |"
          jq -r \
            --arg current_id "${GITHUB_RUN_ID}" \
            --arg current_outcome "${outcome}" \
            '.recent_runs[] | [
              (.name // "unknown" | gsub("\\|"; "\\|")),
              ("[" + (.id | tostring) + "](" + .html_url + ")"),
              (.event // "-"),
              (if (.id | tostring) == $current_id then
                $current_outcome
               else
                ((if (.conclusion // "") == "" then .status else .conclusion end) // "unknown")
               end),
              ((.head_branch // "-") | gsub("\\|"; "\\|")),
              ((.head_sha // "-")[0:12]),
              (.updated_at // .created_at // "-")
            ] | "| " + join(" | ") + " |"' "${metadata_file}"
        } > "${issue_body}"

        issue_number="$(
          gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --search '"Workflow run index" in:title' \
            --json number,title \
            --jq '.[] | select(.title == "Workflow run index") | .number' \
            2>/dev/null | head -n 1 || true
        )"

        if [ -n "${issue_number}" ]; then
          if ! gh issue edit "${issue_number}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file "${issue_body}" >/dev/null; then
            echo "::warning title=Run index not updated::The Run ID remains available in outputs, summary, and artifacts."
          fi
        elif ! gh issue create \
          --repo "${GITHUB_REPOSITORY}" \
          --title "Workflow run index" \
          --body-file "${issue_body}" >/dev/null; then
          echo "::warning title=Run index not created::Grant issues:write to persist the searchable run index."
        fi

        rm -f "${recent_file}"

    - name: Upload run metadata
      uses: actions/upload-artifact@v7
      with:
        name: workflow-run-${{ steps.capture.outputs.run_id }}-${{ steps.capture.outputs.phase }}
        path: ${{ steps.capture.outputs.metadata_file }}
        if-no-files-found: error
        retention-days: 30
